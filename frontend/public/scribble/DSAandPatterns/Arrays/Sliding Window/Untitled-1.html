<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacked Divs</title>
    <style>
        .div1 {
            background-color: #ff6b6b;
            color: white;
            font-size: 24px;
            padding: 20px;
            margin: 10px 0;
            text-align: center;
        }
        
        .div2 {
            background-color: #4ecdc4;
            color: white;
            font-size: 18px;
            padding: 15px;
            margin: 10px 0;
            text-align: center;
        }
        
        .div3 {
            background-color: #45b7d1;
            color: white;
            font-size: 16px;
            padding: 25px;
            margin: 10px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="div1">First Div - Large Font (24px)</div>
    <div class="div2">Second Div - Medium Font (18px)</div>
    <div class="div3">Third Div - Small Font (16px)</div>
</body>
</html>
