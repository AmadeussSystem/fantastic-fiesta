name: Trigger Website Deployment

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.obsidian/snippets/**'

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment in fantastic-fiesta
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.OBSIDIAN_TRIGGER_TOKEN }}
          repository: AmadeussSystem/fantastic-fiesta
          event-type: obsidian-notes-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
